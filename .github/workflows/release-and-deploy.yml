name: Maven Release & Deploy via deploy4j

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Version to release (omit -SNAPSHOT)'
        required: true
      deploy_to:
        description: 'Deployment target (omit for production)'
        required: true
        default: ''

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required for git push, tagging
      actions: read    # Required for workflow access

    steps:
      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      # 2. Set up JDK
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # 3. Determine release version
      - name: Set release version
        id: set_version
        run: |
          RELEASE_VERSION="${{ github.event.inputs.release_version }}"
          echo "Releasing version: $RELEASE_VERSION"
          ./mvnw versions:set -DnewVersion=$RELEASE_VERSION -DprocessAllModules=true -DgenerateBackupPoms=false
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git commit -am "Set release version $RELEASE_VERSION"
          echo "release_version=$RELEASE_VERSION" >> $GITHUB_OUTPUT
        shell: bash

      # 4. Build Maven project
      - name: Build project
        run: ./mvnw clean install -DskipTests=false -DprocessAllModules=true

