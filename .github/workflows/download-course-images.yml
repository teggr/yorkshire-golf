name: Download Course Images

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Maximum number of courses to process (default 999 processes all)'
        required: false
        default: '999'

jobs:
  download-images:

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-deps
          restore-keys: |
            maven-${{ runner.os }}-

      - name: Compile project
        run: mvn compile -B --file pom.xml

      - name: Download course images
        run: mvn exec:java -B --file pom.xml -Dexec.args="${{ github.event.inputs.limit }}"

      - name: Commit downloaded images and updated YAML files
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add src/main/resources/static/images/courses/ src/main/resources/courses/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Download course images [skip ci]"
            git push origin ${{ github.ref_name }}
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
