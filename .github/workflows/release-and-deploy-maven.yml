name: Maven Release & Deploy via deploy4j (Maven Plugin)

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Version to release (omit -SNAPSHOT)'
        required: true
      deploy_to:
        description: 'Deployment target (staging/prod)'
        required: true
        default: 'staging'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required for git push, tagging
      actions: read    # Required for workflow access

    steps:
      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      # 2. Set up JDK
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # 3. Determine release version
      - name: Set release version
        id: set_version
        run: |
          RELEASE_VERSION="${{ github.event.inputs.release_version }}"
          echo "Releasing version: $RELEASE_VERSION"
          ./mvnw versions:set -DnewVersion=$RELEASE_VERSION -DprocessAllModules=true -DgenerateBackupPoms=false
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git commit -am "Set release version $RELEASE_VERSION"
          echo "release_version=$RELEASE_VERSION" >> $GITHUB_OUTPUT
        shell: bash

      # 4. Build Maven project
      - name: Build project
        run: ./mvnw clean install -DskipTests=false -DprocessAllModules=true

      # 5. Tag release
      - name: Tag release
        run: |
          git tag -a "v${{ steps.set_version.outputs.release_version }}" -m "Release ${{ steps.set_version.outputs.release_version }}"
          git push origin "v${{ steps.set_version.outputs.release_version }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 6. Deploy artifact using deploy4j Maven plugin
      - name: Deploy artifact with deploy4j Maven plugin
        run: |
          DEPLOY_TARGET="${{ github.event.inputs.deploy_to }}"
          
          # Run deploy4j using Maven plugin
          # This assumes the deploy4j-maven-plugin is configured in the pom.xml
          ./mvnw dev.deploy4j:deploy4j-maven-plugin:deploy \
            -Ddeploy4j.target=$DEPLOY_TARGET \
            -Ddeploy4j.appName=yorkshire-golf
        env:
          DEPLOY4J_TOKEN: ${{ secrets.DEPLOY4J_TOKEN }}

      # 7. Bump next snapshot version
      - name: Bump next snapshot version
        run: |
          IFS='.' read -r MAJOR MINOR PATCH <<< "${{ steps.set_version.outputs.release_version }}"
          NEXT_PATCH=$((PATCH+1))
          NEXT_VERSION="${MAJOR}.${MINOR}.${NEXT_PATCH}-SNAPSHOT"
          echo "Next snapshot version: $NEXT_VERSION"
          ./mvnw versions:set -DnewVersion=$NEXT_VERSION -DprocessAllModules=true -DgenerateBackupPoms=false
          git commit -am "Bump version to $NEXT_VERSION"
          git push origin ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
