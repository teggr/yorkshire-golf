# Keep tests isolated from the file-backed app database.
spring.datasource.url=jdbc:h2:mem:testdb;MODE=LEGACY;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=never
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
golf.mail.from=noreply@yorkshiregolf.life
golf.app.base-url=http://localhost:8080
