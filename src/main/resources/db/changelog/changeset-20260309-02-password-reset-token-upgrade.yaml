databaseChangeLog:
  - changeSet:
      id: 20260309-02-password-reset-token-upgrade-add-hash
      author: copilot
      preConditions:
        onFail: MARK_RAN
        not:
          columnExists:
            tableName: password_reset_token
            columnName: token_hash
      changes:
        - addColumn:
            tableName: password_reset_token
            columns:
              - column:
                  name: token_hash
                  type: VARCHAR(255)

  - changeSet:
      id: 20260309-02-password-reset-token-upgrade-drop-token-not-null
      author: copilot
      preConditions:
        onFail: MARK_RAN
        sqlCheck:
          expectedResult: "1"
          sql: |
            SELECT COUNT(*)
            FROM INFORMATION_SCHEMA.COLUMNS
            WHERE TABLE_NAME = 'PASSWORD_RESET_TOKEN'
              AND COLUMN_NAME = 'TOKEN'
              AND IS_NULLABLE = 'NO'
      changes:
        - dropNotNullConstraint:
            tableName: password_reset_token
            columnName: token
            columnDataType: VARCHAR(255)

  - changeSet:
      id: 20260309-02-password-reset-token-upgrade-index
      author: copilot
      preConditions:
        onFail: MARK_RAN
        not:
          indexExists:
            tableName: password_reset_token
            indexName: idx_password_reset_token_hash
      changes:
        - createIndex:
            tableName: password_reset_token
            indexName: idx_password_reset_token_hash
            unique: true
            columns:
              - column:
                  name: token_hash

  - changeSet:
      id: 20260309-02-password-reset-token-upgrade-invalidate-legacy
      author: copilot
      changes:
        - update:
            tableName: password_reset_token
            columns:
              - column:
                  name: used
                  valueBoolean: true
            where: token_hash IS NULL AND used = FALSE
