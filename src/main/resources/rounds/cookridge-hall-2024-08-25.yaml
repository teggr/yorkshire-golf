title: Cookridge Hall — A West Yorkshire Gem
date: 2024-08-25
courseName: Cookridge Hall Golf Club
content: |
  Cookridge Hall is a handsome course set around a hotel complex near Leeds. The parkland layout is mature and the greens were in excellent condition during the late summer visit. Some really characterful holes make this one stand out in the West Yorkshire field.
