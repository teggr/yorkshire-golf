title: Back-to-Back with Horsforth Golf Club
date: 2025-01-21
courseName: Horsforth Golf Club
content: |
  Two days, two new courses! Horsforth Golf Club on the outskirts of Leeds is a classic parkland layout with some wonderfully tricky holes. The elevated tee shots on several holes give great views across the city. The club has a great atmosphere and the greens were putting beautifully.
