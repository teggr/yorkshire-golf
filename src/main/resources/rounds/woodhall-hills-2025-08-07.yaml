title: Woodhall Hills — Pudsey Parkland
date: 2025-08-07
courseName: Woodhall Hills Golf Club
content: |
  Woodhall Hills Golf Club in Calverley is a hidden delight. The parkland layout tumbles across an undulating site giving varied and interesting lies throughout the round. The views west towards Bradford and the Pennines on a clear August day were superb. A great club with a warm welcome.
