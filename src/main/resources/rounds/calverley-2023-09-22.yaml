title: Calverley Golf Club — Friendly and Fun
date: 2023-09-22
courseName: Calverley Golf Club
content: |
  Calverley Golf Club in Pudsey is a friendly, welcoming club with a course that is more challenging than its modest appearance suggests. Some tight tree-lined fairways keep you honest and the greens were rolling beautifully. A cracking afternoon out.
