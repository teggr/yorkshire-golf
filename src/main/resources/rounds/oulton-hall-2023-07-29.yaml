id: oulton-hall-2023-07-29
title: Oulton Hall — Grandeur and Great Golf
date: 2023-07-29
courseName: QHotels Oulton Hall Golf Club
content: |
  Playing Oulton Hall feels like stepping back in time. The course is set in the stunning grounds of the Victorian Oulton Hall hotel, giving every round a special atmosphere. The parkland layout is deceptively tricky and the par 3s are particularly memorable. A definite highlight of the challenge so far.
