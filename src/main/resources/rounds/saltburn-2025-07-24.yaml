title: Saltburn by the Sea — Links Golf on the Yorkshire Coast
date: 2025-07-24
courseName: Saltburn by Sea Golf Club
content: |
  A brilliant day out at Saltburn by Sea Golf Club on the North Yorkshire coast. The clifftop course offers dramatic sea views and classic links-style challenges — firm fairways, tricky winds and small greens that demand a deft short game. The seaside setting makes this one of the most memorable rounds of the challenge so far.
