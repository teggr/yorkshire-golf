title: Scarthingwell — A February Surprise
date: 2024-02-25
courseName: Tadcaster Golf Club (Scarthingwell)
content: |
  Scarthingwell is a lovely parkland course south of Tadcaster that I had been looking forward to visiting. Despite the February conditions, the course was in remarkably good shape. The layout has a nice mix of open and wooded holes that kept the round interesting throughout. A great day out.
