title: Headingley Golf Club — Views to Die For
date: 2023-09-25
courseName: Headingley Golf Club
content: |
  Headingley Golf Club sits high above the city of Leeds and offers stunning panoramic views. On a clear autumn day like this one, you can see for miles. The course itself is a genuine challenge with some tricky uphill and downhill lies. Well worth the walk — in every sense.
