title: The Manor Golf Club — Midsummer Magic
date: 2024-07-07
courseName: The Manor Golf Club
content: |
  Playing The Manor Golf Club in midsummer was an absolute delight. The parkland course was lush and green, and the long evenings meant there was no rush. A course that rewards local knowledge but is welcoming to visiting golfers. Really enjoyed the round.
