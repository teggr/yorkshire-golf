title: Garforth Golf Club — Late Summer Parkland
date: 2025-08-16
courseName: Garforth Golf Club
content: |
  Wrapped up a busy summer of golf with a round at Garforth Golf Club east of Leeds. A solid parkland course with some really good holes through the trees on the back nine. The course was playing firm and fast in the August sunshine — proper summer golf conditions. Another one in the bag!
