title: Ganton Golf Club — A True Championship Test
date: 2023-09-06
courseName: Ganton Golf Club
content: |
  Ganton is widely regarded as one of the finest inland courses in England — and after playing it, I completely understand why. The heathland layout is dramatic, the bunkering is severe and the rough demands accuracy off the tee. An absolute bucket-list course. Playing Ganton is a reminder of just how good Yorkshire golf gets.
