title: Ending 2024 at Moor Allerton
date: 2024-12-31
courseName: Moor Allerton Golf Club
content: |
  What better way to see out 2024 than a round at the impressive Moor Allerton Golf Club? The Robert Trent Jones Sr-designed course is one of the most unique in Yorkshire, featuring a distinctive open heathland character. Cold, calm and clear — perfect conditions for a New Year's Eve round. Bring on 2025!
