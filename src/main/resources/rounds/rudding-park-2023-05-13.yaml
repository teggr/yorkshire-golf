id: rudding-park-2023-05-13
title: A Day at the Stunning Rudding Park
date: 2023-05-13
courseName: Rudding Park Golf Club
content: |
  Rudding Park near Harrogate was an absolute treat. The parkland course winds through beautiful mature trees and the hotel estate grounds, making every hole feel like a proper occasion. The greens were immaculate and the facilities are second to none. Well worth a visit if you are doing the Yorkshire circuit.
