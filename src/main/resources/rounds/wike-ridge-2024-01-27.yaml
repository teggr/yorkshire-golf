title: January Golf at Leeds Golf Centre
date: 2024-01-27
courseName: Leeds Golf Centre (Wike Ridge)
content: |
  Braving the Yorkshire winter to tick off the Wike Ridge course at Leeds Golf Centre. The course was cold, damp and windy — perfect Yorkshire winter golf conditions. The layout is open and exposed but the value for money is excellent and the staff were great. Ticking boxes in January feels particularly satisfying.
