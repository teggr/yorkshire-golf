title: Cleveland Golf Club — Seaside Flair
date: 2024-08-01
courseName: Cleveland Golf Club
content: |
  Cleveland Golf Club near Redcar delivers some links-style coastal golf that makes a refreshing change of scenery. The sea breeze adds an extra challenge to shot selection and the views are stunning. A cracking summer round on the North Yorkshire coast.
