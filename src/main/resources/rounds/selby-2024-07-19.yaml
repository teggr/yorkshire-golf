title: Selby Golf Club — Flat but Rewarding
date: 2024-07-19
courseName: Selby Golf Club
content: |
  Selby Golf Club sits in the flat landscape south of York and delivers a traditional parkland test. Flat doesn't mean easy though — the course uses its mature trees and water features cleverly to create genuine strategic challenges. A solid day's golf in good company.
