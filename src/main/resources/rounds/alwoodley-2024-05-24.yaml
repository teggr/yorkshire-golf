title: Alwoodley — One of Yorkshire's Finest
date: 2024-05-24
courseName: Alwoodley Golf Club
content: |
  Alwoodley Golf Club is a genuine classic — a heathland masterpiece designed by Alister MacKenzie (who also designed Augusta National). Playing here was a real privilege. Every hole feels thoughtfully crafted and the natural beauty of the heathland setting is breathtaking in late May. A course every golfer in Yorkshire should play.
