title: Knaresborough Golf Club — Taking in the Views
date: 2025-05-18
courseName: Knaresborough Golf Club
content: |
  Knaresborough Golf Club offers a stunning setting above the town and the River Nidd gorge. The views on several holes are genuinely breathtaking and distract you nicely from the challenge of hitting the fairway. A memorable and enjoyable round in North Yorkshire.
