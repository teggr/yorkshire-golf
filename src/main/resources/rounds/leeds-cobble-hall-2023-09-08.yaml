title: Leeds Golf Club (Cobble Hall) — City Golf at Its Best
date: 2023-09-08
courseName: Leeds Golf Club (Cobble Hall)
content: |
  A pleasant parkland course within the city of Leeds that punches well above its weight. The Cobble Hall course offers a proper test despite its urban surroundings and is always well presented. A great option for a midweek round when you want to stay close to the city.
