title: Summer Golf at Scarcroft
date: 2023-07-06
courseName: Scarcroft Golf Club
content: |
  A warm summer Sunday at Scarcroft Golf Club just north of Leeds. A well-regarded club with a challenging layout that rewards precise iron play. The views across the Vale of York on the back nine are superb. Great course in fine condition — exactly what you want for a July round.
