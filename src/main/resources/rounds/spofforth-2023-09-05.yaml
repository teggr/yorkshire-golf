title: A Hidden Gem at Spofforth
date: 2023-09-05
courseName: Spofforth Golf Club
content: |
  Spofforth Golf Club is a compact but delightful course tucked away in a quiet North Yorkshire village. A real hidden gem on the Yorkshire golf scene. The welcome was warm, the course was in great shape and the round was thoroughly enjoyable. These smaller clubs are one of the best parts of the challenge.
