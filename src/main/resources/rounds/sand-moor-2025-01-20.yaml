id: sand-moor-2025-01-20
title: Sand Moor — Into 2025
date: 2025-01-20
courseName: Sand Moor Golf Club
content: |
  First round of 2025 and a new course ticked off — Sand Moor Golf Club in Leeds. A heathland course with an Alister MacKenzie pedigree (he advised on the layout), Sand Moor is atmospheric and challenging in equal measure. The sandy subsoil means it drains well and plays well even in January. A great start to the new year.
