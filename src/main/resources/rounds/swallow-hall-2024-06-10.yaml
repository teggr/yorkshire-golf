courseName: Swallow Hall Golf Club
content: |
  A pleasant round at Swallow Hall Golf Club near York. A nicely maintained course with a welcoming atmosphere. Some really interesting holes along the river make for a memorable back nine. Good value and well worth a visit when touring East Yorkshire.
