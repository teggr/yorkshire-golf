id: moortown-2023-04-09
title: Kicking Off the Yorkshire Challenge at Moortown
date: 2023-04-09
courseName: Moortown Golf Club
content: |
  Started my Yorkshire Golf Challenge at the prestigious Moortown Golf Club in Leeds. A classic parkland course steeped in history — it hosted the 1929 Ryder Cup and has a timeless feel to it. The course was in excellent condition and provided a stern but fair test from the first tee to the 18th green. A fantastic way to kick off the challenge!
