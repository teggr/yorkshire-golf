#logging.level.org.springframework.web=TRACE
#logging.level.web=DEBUG

# H2 file-based database
spring.datasource.url=jdbc:h2:file:./data/golfdb;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Auto-create schema on startup
spring.sql.init.mode=always

# H2 console (disable in production)
spring.h2.console.enabled=false

# Mail - default from address
golf.mail.from=noreply@yorkshiregolf.life

# Base URL used for generating links in emails
golf.app.base-url=http://localhost:8080

# Geocoding
geocoding.user-agent=YorkshireGolf/1.0 (https://yorkshiregolf.life)
