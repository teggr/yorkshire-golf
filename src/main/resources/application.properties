#logging.level.org.springframework.web=TRACE
#logging.level.web=DEBUG

# H2 file-based database
spring.datasource.url=jdbc:h2:file:./data/golfdb;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Auto-create schema on startup
spring.sql.init.mode=never
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

# H2 console (disable in production)
spring.h2.console.enabled=false

# Mail - default from address
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:25}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS_ENABLE:false}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_SMTP_STARTTLS_REQUIRED:false}

# Base URL used for generating links in emails
golf.app.base-url=${APP_BASE_URL:http://localhost:8080}
golf.google-maps.api-key=${GOOGLE_MAPS_API_KEY:}
golf.mail.from=${MAIL_FROM:noreply@email.yorkshiregolf.life}

# Provider credentials are deployment secrets. Providers are independent and opt-in.
golf.auth.google.enabled=${AUTH_GOOGLE_ENABLED:false}
golf.auth.google.client-id=${AUTH_GOOGLE_CLIENT_ID:}
golf.auth.google.client-secret=${AUTH_GOOGLE_CLIENT_SECRET:}
golf.auth.apple.enabled=${AUTH_APPLE_ENABLED:false}
golf.auth.apple.client-id=${AUTH_APPLE_CLIENT_ID:}
golf.auth.apple.client-secret=${AUTH_APPLE_CLIENT_SECRET:}
golf.auth.facebook.enabled=${AUTH_FACEBOOK_ENABLED:false}
golf.auth.facebook.client-id=${AUTH_FACEBOOK_CLIENT_ID:}
golf.auth.facebook.client-secret=${AUTH_FACEBOOK_CLIENT_SECRET:}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Geocoding
geocoding.user-agent=YorkshireGolf/1.0 (https://yorkshiregolf.life)
