# Mailpit is now started automatically via Spring Boot Testcontainers (TestGolfTrackerApplication).
# This file is kept for reference only — run `docker compose up` manually if preferred.
services:
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
