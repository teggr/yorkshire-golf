service: golf-tracker
image: teggr/yorkshire-golf
servers:
  web:
    hosts:
      - 46.224.198.56
    labels:
      traefik.http.routers.golf-tracker.rule: "Host(`yorkshiregolf.life`) || Host(`www.yorkshiregolf.life`)"
      traefik.http.routers.golf-tracker.entrypoints: "websecure"
      traefik.http.routers.golf-tracker.tls: "true"
      traefik.http.routers.golf-tracker.tls.certresolver: "letsencrypt"
registry:
  username:
    - DOCKER_USERNAME
  password:
    - DOCKER_PASSWORD
ssh:
  user: root
  port: 22
  key_path:
    - PRIVATE_KEY
  key_passphrase:
    - PRIVATE_KEY_PASSPHRASE
  strict_host_key_checking: false
traefik:
  options:
    publish: "443:443"
    volume: "/etc/deploy4j/letsencrypt:/letsencrypt"
  args:
    entryPoints.web.address: ":80"
    entryPoints.websecure.address: ":443"
    entryPoints.web.http.redirections.entryPoint.to: "websecure"
    entryPoints.web.http.redirections.entryPoint.scheme: "https"
    entryPoints.web.http.redirections.entrypoint.permanent: true
    certificatesResolvers.letsencrypt.acme.email: "robin@tegg.me.uk"
    certificatesResolvers.letsencrypt.acme.storage: "/letsencrypt/acme.json"
    certificatesResolvers.letsencrypt.acme.httpchallenge: true
    certificatesResolvers.letsencrypt.acme.httpchallenge.entrypoint: "web"
